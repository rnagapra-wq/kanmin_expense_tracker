<!DOCTYPE html>
<html>
<head>
  <title>Manage Accounts</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f1f8e9; padding: 20px; }
    h2 { text-align: center; color: #2e7d32; }
    form { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    input, select, button { padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
    button { background-color: #2e7d32; color: white; cursor: pointer; }
    button:hover { background-color: #1b5e20; }
    table { width: 80%; margin: 20px auto; border-collapse: collapse; background-color: #fff; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
    th { background-color: #81c784; color: white; }
    a { color: #2e7d32; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>Manage Bank Accounts</h2>

  <!-- Add new account form -->
  <form method="POST">
    <input type="text" name="account_name" placeholder="Account Name" required>
    <select name="account_type" required>
      <option value="Debit">Debit</option>
      <option value="Credit">Credit</option>
    </select>
    <input type="number" step="0.01" name="balance" placeholder="Starting Balance" required>
    <button type="submit">Add Account</button>
  </form>

  <!-- Accounts table -->
  <table>
    <thead>
      <tr>
        <th>Account Name</th>
        <th>Type</th>
        <th>Balance</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for acc in accounts %}
        <tr>
          <td>{{ acc[1] }}</td>
          <td>{{ acc[2] }}</td>
          <td>{{ acc[3] }}</td>
          <td>
            <a href="{{ url_for('edit_account', account_id=acc[0]) }}">Edit</a> |
            <a href="{{ url_for('delete_account', account_id=acc[0]) }}">Delete</a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

  <div style="text-align:center; margin-top:20px;">
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
  </div>
</body>
</html>
