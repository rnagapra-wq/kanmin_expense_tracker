<!DOCTYPE html>
<html>
<head>
  <title>Kanmin Expense - Login</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: linear-gradient(to right, #e0f7fa, #f1f8e9); 
      margin: 0; 
      padding: 40px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh;
    }
    .login-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }
    h2 { color: #2e7d32; margin-bottom: 20px; }
    input, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #2e7d32;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #1b5e20; }
    a { color: #2e7d32; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .alert-success { background:#d4edda; color:#155724; padding:10px; margin-bottom:10px; border-radius:5px; }
    .alert-error { background:#f8d7da; color:#721c24; padding:10px; margin-bottom:10px; border-radius:5px; }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- ✅ Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div>
          {% for category, message in messages %}
            <div class="alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <h2>Login</h2>
    <form method="POST">
      <input type="text" name="username" placeholder="Username" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
    <p>New user? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</body>
</html>
